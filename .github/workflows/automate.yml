# Automation: find a random long video, clip its best moments, upload to YouTube
# Runs on GitHub Actions (ubuntu-latest). No PC required.

name: Clip & Publish

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      query:
        description: "Search query for long videos"
        required: false
        default: "gameplay highlights"
      max_clips:
        description: "Number of best moments to clip"
        required: false
        default: "3"
      clip_seconds:
        description: "Length of each clip (seconds, 45-70)"
        required: false
        default: "60"

permissions:
  contents: write

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/whisper
          key: models-${{ runner.os }}-v1
          restore-keys: models-${{ runner.os }}-

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run automation
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SEARCH_QUERY: ${{ github.event.inputs.query || 'gameplay highlights' }}
          MAX_CLIPS: ${{ github.event.inputs.max_clips || '3' }}
          CLIP_SECONDS: ${{ github.event.inputs.clip_seconds || '60' }}
        run: python scripts/main.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clips
          path: out/
          retention-days: 7
